<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login</title>
  <style>
    :root{
      --bg: #071428; --card: #081625; --accent:#b91c1c; --muted:#9aa4b2; --text:#e6eef8; --radius:12px;
    }
    html,body{height:100%}
    body { font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; background: linear-gradient(180deg,var(--bg), #04101a); color:var(--text); }
    .wrap { max-width: 420px; margin: 48px auto; }
    .card { background: linear-gradient(180deg,var(--card), #041018); border-radius: var(--radius); padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.03); }
    label { display: block; font-size: 14px; margin-top: 10px; color:var(--muted); }
    input { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; background: transparent; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); color:var(--text); }
    button { margin-top: 14px; width: 100%; padding: 12px; cursor: pointer; border-radius: 10px; background: var(--accent); color: white; font-weight:600; border:0 }
    .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .error { background: rgba(185,28,28,0.12); border: 1px solid rgba(239,68,68,0.1); padding: 10px; border-radius: 10px; margin-top: 12px; color: #ffdada }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="margin: 0 0 8px 0;">Admin Login</h2>

      {% if password_configured is defined and not password_configured %}
        <div class="error">
          Admin password is not configured. Set <b>ADMIN_PASSWORD</b> in environment variables.
        </div>
      {% endif %}

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Sign in</button>
      </form>

      <div class="hint">
        Uses <b>ADMIN_USERNAME</b> / <b>ADMIN_PASSWORD</b> (environment variables).
      </div>
    </div>
  </div>
</body>
</html>
